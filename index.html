<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fatigue Check</title>

  <link rel="manifest" href="manifest.json">

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>

  <!-- MediaPipe FaceMesh -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <style>
    body { margin:0; background:#111; color:#fff; text-align:center; font-family:-apple-system; }
    .container { padding:20px; }
    h1 { font-size:26px; margin-bottom:10px; }

    .gauge { position:relative; width:220px; height:220px; margin:0 auto; }
    svg { width:100%; height:100%; transform:rotate(-90deg); }
    circle { fill:none; stroke-width:10; stroke-linecap:round; }
    .bg { stroke:#333; }
    .fg { stroke:#00ff88; stroke-dasharray:283; stroke-dashoffset:283; transition:0.5s; }

    .score { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:48px; }
    .status { margin-top:10px; font-size:22px; }

    .metrics { margin-top:20px; display:flex; justify-content:center; gap:12px; }
    .card { background:#222; padding:10px 14px; border-radius:8px; min-width:90px; }

    video {
  opacity: 0;
  position: absolute;
  top: 0;
  left: 0;
  width: 320px;
  height: 240px;
  z-index: -1;
}
  </style>
</head>

<body>
  <div class="container">
    <h1>Fatigue Check</h1>
<button id="startBtn" style="padding:12px 20px; font-size:18px; margin-bottom:15px;">
  計測開始
</button>


    <div class="gauge">
      <svg viewBox="0 0 100 100">
        <circle class="bg" cx="50" cy="50" r="45"/>
        <circle class="fg" cx="50" cy="50" r="45"/>
      </svg>
      <div class="score" id="scoreValue">--</div>
    </div>

    <div class="status" id="statusLabel">計測待ち</div>

    <div class="metrics">
      <div class="card">HR: <span id="hrValue">--</span></div>
      <div class="card">HRV: <span id="hrvValue">--</span></div>
      <div class="card">SNR: <span id="snrValue">--</span></div>
    </div>
  </div>

  <video id="video" width="640" height="480" autoplay playsinline></video>

  <script src="app.js"></script>
</body>
</html>
