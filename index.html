<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>疲労度チェック rPPG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ① 待機画面 -->
<div id="start-screen" class="screen active">
  <header>疲労度チェック rPPG</header>
  <p>目を上下2本のガイド線の間に合わせてください。</p>

  <div class="videoWrapper">
    <!-- ★ video/canvas はここに1つだけ -->
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="240" height="180"></canvas>
  </div>

  <button id="startBtn">測定開始</button>
</div>

<!-- ② 測定中画面 -->
<div id="measure-screen" class="screen">
  <header>測定中（20秒）</header>

  <!-- ★ video/canvas はここには置かない（重複禁止） -->
  <div class="videoWrapper">
    <!-- 空の div。video/canvas は start-screen のものを使う -->
  </div>

  <div id="status"></div>
  <div id="faceWarning"></div>

  <div id="progressContainer">
    <div id="progressBar"></div>
  </div>
</div>

<!-- ③ 結果画面 -->
<div id="result-screen" class="screen">
  <header>測定結果</header>

  <div id="scoreBox">
    <div class="label">疲労スコア</div>
    <div class="value" id="fatigueScore">--</div>

    <div class="label">疲労レベル</div>
    <div class="value" id="fatigueLevel">--</div>

    <div class="label">作業可否</div>
    <div class="value" id="workStatus">--</div>

    <div class="label">危険作業判定</div>
    <div class="value" id="dangerStatus">--</div>

    <div id="results"></div>
  </div>

  <button id="retryBtn">再測定</button>
</div>

<script src="app.js"></script>
</body>
</html>
