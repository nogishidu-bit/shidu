<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fatigue Check</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- PWA service worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 26px;
      font-weight: 600;
    }

    /* 円形ゲージ */
    .gauge {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto;
    }

    svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    circle {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
    }

    .bg {
      stroke: #333;
    }

    .fg {
      stroke: #00ff88;
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      transition: stroke-dashoffset 0.5s, stroke 0.5s;
    }

    .score {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: bold;
    }

    .status {
      margin-top: 10px;
      font-size: 22px;
    }

    /* HR / HRV / SNR カード */
    .metrics {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .card {
      background: #222;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 16px;
      min-width: 90px;
    }

    .footer {
      margin-top: 20px;
      opacity: 0.7;
    }

    video {
      display: none; /* rPPG用の隠しカメラ映像 */
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Fatigue Check</h1>

    <!-- 円形ゲージ -->
    <div class="gauge">
      <svg viewBox="0 0 100 100">
        <circle class="bg" cx="50" cy="50" r="45" />
        <circle class="fg" cx="50" cy="50" r="45" />
      </svg>
      <div class="score" id="scoreValue">--</div>
    </div>

    <!-- 状態ラベル -->
    <div class="status" id="statusLabel">計測待ち</div>

    <!-- HR / HRV / SNR -->
    <div class="metrics">
      <div class="card">HR: <span id="hrValue">--</span></div>
      <div class="card">HRV: <span id="hrvValue">--</span></div>
      <div class="card">SNR: <span id="snrValue">--</span></div>
    </div>

    <div class="footer">測定中…</div>
  </div>

  <!-- rPPG用の隠しビデオ -->
  <video id="video" autoplay playsinline></video>

  <script>
    /* -----------------------------
       UI 更新関数（本番）
    ------------------------------*/
    function updateUI(score, hr, hrv, snr) {
      const max = 283;
      const offset = max - (max * score) / 100;

      const fg = document.querySelector(".fg");
      fg.style.strokeDashoffset = offset;

      // 色分け
      if (score >= 80) fg.style.stroke = "#00ff88";     // 緑
      else if (score >= 60) fg.style.stroke = "#ffaa00"; // 黄
      else if (score >= 40) fg.style.stroke = "#ff6600"; // 橙
      else fg.style.stroke = "#ff0033";                  // 赤

      // 数値表示
      document.getElementById("scoreValue").textContent = score;
      document.getElementById("hrValue").textContent = hr;
      document.getElementById("hrvValue").textContent = hrv;
      document.getElementById("snrValue").textContent = snr;

      // 状態ラベル
      const label = document.getElementById("statusLabel");
      if (score >= 80) label.textContent = "最良";
      else if (score >= 60) label.textContent = "良好";
      else if (score >= 40) label.textContent = "注意";
      else label.textContent = "危険";
    }

    /* -----------------------------
       疲労スコア計算（あなたのPoC仕様）
    ------------------------------*/
    function calcFatigueScore(hr, hrv, snr, face, blink) {
      const hrNorm = Math.max(0, Math.min(100, 100 - Math.abs(hr - 75)));
      const hrvNorm = Math.max(0, Math.min(100, hrv));
      const snrNorm = Math.max(0, Math.min(100, snr * 8));
      const faceNorm = Math.max(0, Math.min(100, face));
      const blinkNorm = Math.max(0, Math.min(100, blink));

      return Math.round(
        hrNorm * 0.2 +
        hrvNorm * 0.4 +
        snrNorm * 0.2 +
        faceNorm * 0.1 +
        blinkNorm * 0.1
      );
    }

    /* -----------------------------
       rPPG開始（本番）
    ------------------------------*/
    async function startRPPG() {
      const video = document.getElementById("video");

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" }
      });

      video.srcObject = stream;

      // 2秒ごとに計算
      setInterval(() => {
        // ★ あなたの rPPG ロジックに置き換える部分
        const hr = Math.floor(60 + Math.random() * 20);
        const hrv = Math.floor(20 + Math.random() * 40);
        const snr = Math.random() * 3 + 1;
        const face = Math.random() * 100;
        const blink = Math.random() * 100;

        const score = calcFatigueScore(hr, hrv, snr, face, blink);

        // ★ UI 更新
        updateUI(score, hr, hrv, snr);

      }, 2000);
    }

    startRPPG();
  </script>
</body>
</html>
