<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>目ガイド版 rPPG</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>
    body { background:#111; color:#eee; text-align:center; margin:0; }
    video, canvas {
      width:260px;
      transform:scaleX(-1);
      border-radius:8px;
    }
    button { margin-top:10px; padding:10px 20px; }
  </style>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "./wasm/vision_bundle.js";

    let landmarker;
    let video, canvas, ctx;
    let running = false;

    async function initFaceLandmarker() {
      const vision = await FilesetResolver.forVisionTasks("./wasm");

      landmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "./wasm/face_landmarker.task"
        },
        runningMode: "VIDEO",
        numFaces: 1
      });
    }

    async function initCamera() {
      video = document.getElementById("video");
      canvas = document.getElementById("canvas");
      ctx = canvas.getContext("2d");

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });
      video.srcObject = stream;

      return new Promise(resolve => {
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          resolve();
        };
      });
    }

    function drawEye(points) {
      ctx.beginPath();
      ctx.strokeStyle = "#1e88e5";
      ctx.lineWidth = 2;

      const p0 = points[0];
      ctx.moveTo(p0.x * canvas.width, p0.y * canvas.height);

      for (let i = 1; i < points.length; i++) {
        const p = points[i];
        ctx.lineTo(p.x * canvas.width, p.y * canvas.height);
      }

      ctx.closePath();
      ctx.stroke();
    }

    async function detectLoop() {
      if (!running) return;

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const now = performance.now();
      const result = await landmarker.detectForVideo(video, now);

      if (result.faceLandmarks?.length > 0) {
        const lm = result.faceLandmarks[0];

        const leftIdx = [33,7,163,144,145,153,154,155,133];
        const rightIdx = [263,249,390,373,374,380,381,382,362];

        drawEye(leftIdx.map(i => lm[i]));
        drawEye(rightIdx.map(i => lm[i]));
      }

      requestAnimationFrame(detectLoop);
    }

    async function start() {
      if (running) return;
      running = true;

      await initCamera();
      await initFaceLandmarker();

      detectLoop();
    }

    window.start = start;
  </script>
</head>

<body>
  <h2>目の輪郭ガイド版</h2>
  <button onclick="start()">開始</button><br>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
</body>
</html>
