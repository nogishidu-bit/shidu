<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>疲労度チェック rPPG（上下2本ガイド線版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">

  <link rel="stylesheet" href="style.css">
</head>

<body>
<header>疲労度チェック rPPG（上下2本ガイド線版）</header>

<main>
  <p>目を上下2本のガイド線の間に合わせてください（20秒）。</p>
  <button id="startBtn">測定開始</button><br>

  <div class="videoWrapper">
    <video id="video" autoplay playsinline></video>
  </div>

  <!-- ガイド線は canvas に描画するため HTML から削除 -->
  <canvas id="canvas" width="240" height="180"></canvas>

  <div id="status"></div>
  <div id="faceWarning"></div>

  <div id="progressContainer">
    <div id="progressBar"></div>
  </div>

  <div id="scoreBox">
    <div class="label">疲労スコア（0〜100）</div>
    <div class="value" id="fatigueScore">--</div>

    <div class="label">疲労レベル</div>
    <div class="value" id="fatigueLevel">--</div>

    <div class="label">作業可否</div>
    <div class="value" id="workStatus">--</div>

    <div class="label">危険作業判定</div>
    <div class="value" id="dangerStatus">--</div>

    <div id="results"></div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
