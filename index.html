<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>疲労度チェック rPPG PWA（目線ズレ対応）</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">
  <style>
    body { margin:0; font-family: system-ui, sans-serif; background:#111; color:#eee; text-align:center; }
    header { padding:10px 0; background:#181818; font-size:18px; font-weight:bold; }
    main { padding:10px; position:relative; }
    video { width:260px; max-width:80vw; transform:scaleX(-1); border-radius:8px; margin-top:8px; }

    #startBtn { padding:10px 20px; font-size:16px; margin:10px 0; border-radius:6px; border:none; background:#1e88e5; color:#fff; }
    #startBtn:disabled { background:#555; }

    #status { font-size:13px; color:#ccc; min-height:2em; white-space:pre-line; }

    /* 顔枠（楕円） */
    #faceGuide {
      position: absolute;
      top: 160px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 280px;
      border: 2px solid #1e88e5;
      border-radius: 50% / 60%;
      opacity: 0.6;
      pointer-events: none;
      display: none;
    }

    /* 目の位置ガイド線 */
    #eyeLine {
      position: absolute;
      top: 38%;
      left: 0;
      width: 100%;
      height: 2px;
      background: #1e88e5;
      opacity: 0.7;
    }

    /* 棒ゲージ */
    #progressContainer {
      width: 80%;
      height: 12px;
      background: #333;
      border-radius: 6px;
      margin: 10px auto;
      overflow: hidden;
    }
    #progressBar {
      width: 0%;
      height: 100%;
      background: #1e88e5;
      transition: width 0.3s linear, background 0.2s linear;
    }

    #faceWarning {
      color:#ff5252;
      font-weight:bold;
      min-height:1.5em;
      margin-top:5px;
    }

    #results { margin-top:10px; font-size:14px; white-space:pre-line; }
    #scoreBox { margin-top:10px; padding:10px; border-radius:8px; background:#222; display:inline-block; min-width:260px; }

    .label { color:#aaa; font-size:12px; }
    .value { font-size:18px; font-weight:bold; margin-bottom:4px; }

    .level-safe { color:#4caf50; }
    .level-normal { color:#8bc34a; }
    .level-caution { color:#ffeb3b; }
    .level-warning { color:#ff9800; }
    .level-danger { color:#f44336; }

    canvas { display:none; }
  </style>
</head>
<body>
<header>疲労度チェック rPPG（目線ズレ対応）</header>
<main>
  <p>目線をガイド線に合わせてください（20秒）。</p>
  <button id="startBtn">測定開始</button><br>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" width="240" height="180"></canvas>

  <div id="faceGuide">
    <div id="eyeLine"></div>
  </div>

  <div id="status"></div>
  <div id="faceWarning"></div>

  <div id="progressContainer">
    <div id="progressBar"></div>
  </div>

  <div id="scoreBox">
    <div class="label">疲労スコア（0〜100）</div>
    <div class="value" id="fatigueScore">--</div>

    <div class="label">疲労レベル</div>
    <div class="value" id="fatigueLevel">--</div>

    <div class="label">作業可否</div>
    <div class="value" id="workStatus">--</div>

    <div class="label">危険作業判定</div>
    <div class="value" id="dangerStatus">--</div>

    <div id="results"></div>
  </div>
</main>

<script>
  const FPS = 30;
  const DURATION_SEC = 20;

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('startBtn');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');
  const fatigueEl = document.getElementById('fatigueScore');
  const levelEl = document.getElementById('fatigueLevel');
  const workEl = document.getElementById('workStatus');
  const dangerEl = document.getElementById('dangerStatus');
  const progressBar = document.getElementById('progressBar');
  const faceWarning = document.getElementById('faceWarning');

  let rgbSeries = [];
  let brightnessSeries = [];
  let baseBrightness = null;
  let baseSamples = [];
  let running = false;
  let eyeOut = false;
  let validSeconds = 0;

  function logStatus(msg) { statusEl.textContent = msg; }
  function logResults(msg) { resultsEl.textContent = msg; }
    function captureFrame() {
    if (!running) return;

    const w = canvas.width;
    const h = canvas.height;

    ctx.drawImage(video, 0, 0, w, h);

    const size = 32;

    /* ★ 目線判定用 ROI（eyeLine の高さ） */
    const eyeY = Math.floor(h * 0.38);
    const sx = Math.floor(w / 2 - size / 2);
    const sy = Math.floor(eyeY - size / 2);

    const img = ctx.getImageData(sx, sy, size, size).data;

    let r = 0, g = 0, b = 0, c = 0;
    for (let i = 0; i < img.length; i += 4) {
      r += img[i];
      g += img[i + 1];
      b += img[i + 2];
      c++;
    }

    const R = r / c, G = g / c, B = b / c;
    rgbSeries.push([R, G, B]);

    const brightness = (R + G + B) / 3;
    brightnessSeries.push(brightness);

    /* --- 基準明るさの収集（最初の1秒間） --- */
    if (baseBrightness === null && baseSamples.length < FPS) {
      baseSamples.push(brightness);
      if (baseSamples.length === FPS) {
        baseBrightness = mean(baseSamples);
      }
    }

    /* --- 目線ズレ判定 --- */
    eyeOut = false;

    if (baseBrightness) {
      const diff = Math.abs(brightness - baseBrightness);
      eyeOut = diff > 25;

      if (eyeOut) {
        faceWarning.textContent = "目線が外れています";
        progressBar.style.background = "#ff5252";  /* 赤 */
      } else {
        faceWarning.textContent = "";
        progressBar.style.background = "#1e88e5";  /* 青 */
      }
    }
  }

  function mean(arr) {
    return arr.reduce((a, b) => a + b, 0) / arr.length;
  }

  function std(arr) {
    const m = mean(arr);
    return Math.sqrt(arr.reduce((s, x) => s + (x - m) ** 2, 0) / arr.length);
  }

  function detrendAndSmooth(sig, win = 5) {
    const n = sig.length;
    const m = mean(sig);
    const x = sig.map(v => v - m);
    const y = [];

    for (let i = 0; i < n; i++) {
      let s = 0, c = 0;
      for (let k = -win; k <= win; k++) {
        const j = i + k;
        if (j >= 0 && j < n) {
          s += x[j];
          c++;
        }
      }
      y.push(s / c);
    }
    return y;
  }

  function pos(rgbSeries) {
    const n = rgbSeries.length;
    const r = rgbSeries.map(v => v[0]);
    const g = rgbSeries.map(v => v[1]);
    const b = rgbSeries.map(v => v[2]);

    const mr = mean(r), mg = mean(g), mb = mean(b);

    const X = [], Y = [];
    for (let i = 0; i < n; i++) {
      const nr = r[i] / mr;
      const ng = g[i] / mg;
      const nb = b[i] / mb;

      X.push(ng - nb);
      Y.push(-2 * nr + ng + nb);
    }

    const alpha = std(X) / (std(Y) || 1);
    const s = X.map((v, i) => v + alpha * Y[i]);

    return detrendAndSmooth(s, 3);
  }

  function fftHR(signal, fps) {
    const n = signal.length;
    const re = new Array(n).fill(0);
    const im = new Array(n).fill(0);

    for (let k = 0; k < n; k++) {
      for (let t = 0; t < n; t++) {
        const angle = -2 * Math.PI * k * t / n;
        re[k] += signal[t] * Math.cos(angle);
        im[k] += signal[t] * Math.sin(angle);
      }
    }

    const mag = [];
    for (let k = 0; k < n / 2; k++) {
      mag.push(Math.sqrt(re[k] ** 2 + im[k] ** 2));
    }

    const df = fps / n;
    const minHz = 0.7, maxHz = 4.0;

    const minIndex = Math.floor(minHz / df);
    const maxIndex = Math.floor(maxHz / df);

    let maxVal = -1, maxIdx = minIndex;
    let sum = 0;

    for (let k = minIndex; k <= maxIndex; k++) {
      const v = mag[k];
      if (v > maxVal) {
        maxVal = v;
        maxIdx = k;
      }
      sum += v;
    }

    const peakFreq = maxIdx * df;
    const hr = peakFreq * 60;

    const noiseMean = sum / (maxIndex - minIndex + 1);
    const snr = 10 * Math.log10((maxVal + 1e-6) / (noiseMean + 1e-6));

    return { hr, snr };
  }
    function estimateHRV(signal, fps) {
    const peaks = [];
    for (let i = 1; i < signal.length - 1; i++) {
      if (signal[i] > signal[i - 1] && signal[i] > signal[i + 1]) peaks.push(i);
    }
    if (peaks.length < 3) return null;

    const rr = [];
    for (let i = 0; i < peaks.length - 1; i++) {
      rr.push((peaks[i + 1] - peaks[i]) / fps);
    }
    if (rr.length < 2) return null;

    const diff2 = [];
    for (let i = 0; i < rr.length - 1; i++) {
      diff2.push((rr[i + 1] - rr[i]) ** 2);
    }
    return Math.sqrt(mean(diff2)) * 1000;
  }

  function eyelidScore(brightnessSeries) {
    if (brightnessSeries.length < 10) return 50;

    const minB = Math.min(...brightnessSeries);
    const maxB = Math.max(...brightnessSeries);
    const norm = brightnessSeries.map(v => (v - minB) / (maxB - minB + 1e-6));

    const avgOpen = mean(norm);

    let blinks = 0;
    for (let i = 1; i < norm.length; i++) {
      if (norm[i] < norm[i - 1] - 0.15) blinks++;
    }

    const blinkPenalty = Math.min(0.3, blinks / 20);
    const score = (avgOpen - blinkPenalty) * 100;
    return Math.max(0, Math.min(100, score));
  }

  function fatigueScore(hr, snr, rmssd, eyelid) {
    const hrNorm = Math.max(0, Math.min(1, (hr - 50) / 50));
    const snrNorm = Math.max(0, Math.min(1, snr / 10));
    const rmssdNorm = rmssd ? Math.max(0, Math.min(1, rmssd / 80)) : 0.5;
    const eyeNorm = eyelid / 100;

    const fatigue =
      hrNorm * 0.30 +
      (1 - rmssdNorm) * 0.35 +
      (1 - eyeNorm) * 0.25 +
      (1 - snrNorm) * 0.05 +
      0.05;

    return Math.round((1 - fatigue) * 100);
  }

  function fatigueLevel(score) {
    levelEl.className = "";

    if (score >= 80) { levelEl.classList.add("level-safe"); return "レベル5：最良（Safe）"; }
    if (score >= 60) { levelEl.classList.add("level-normal"); return "レベル4：良好（Normal）"; }
    if (score >= 40) { levelEl.classList.add("level-caution"); return "レベル3：注意（Caution）"; }
    if (score >= 20) { levelEl.classList.add("level-warning"); return "レベル2：要警戒（Warning）"; }

    levelEl.classList.add("level-danger");
    return "レベル1：危険（Danger）";
  }

  function fatigueWorkStatus(score) {
    if (score >= 80) return "作業可（安全）";
    if (score >= 60) return "作業可（軽度疲労）";
    if (score >= 40) return "注意（要観察）";
    if (score >= 20) return "作業不可（休憩推奨）";
    return "作業禁止（危険）";
  }

  function dangerWorkStatus(score) {
    if (score >= 80) return "OK（安全）";
    if (score >= 60) return "OK（軽度疲労：重作業は注意）";
    if (score >= 40) return "NG（危険作業不可）";
    if (score >= 20) return "NG（休憩推奨）";
    return "NG（作業禁止）";
  }

  /* --- 測定終了処理 --- */
  function finishMeasurement() {
    running = false;
    document.getElementById("faceGuide").style.display = "none";
    faceWarning.textContent = "";
    logStatus("解析中…");

    if (rgbSeries.length < FPS * 10) {
      logStatus("データ不足。もう一度測定してください。");
      startBtn.disabled = false;
      progressBar.style.width = "0%";
      return;
    }

    const sig = pos(rgbSeries);
    const { hr, snr } = fftHR(sig, FPS);
    const rmssd = estimateHRV(sig, FPS);
    const eyelid = eyelidScore(brightnessSeries);
    const score = fatigueScore(hr, snr, rmssd, eyelid);

    fatigueEl.textContent = score;
    levelEl.textContent = fatigueLevel(score);
    workEl.textContent = fatigueWorkStatus(score);
    dangerEl.textContent = dangerWorkStatus(score);

    let txt = "";
    txt += `推定HR: ${hr.toFixed(1)} bpm\n`;
    txt += `SNR: ${snr.toFixed(1)} dB\n`;
    txt += rmssd ? `HRV(RMSSD): ${rmssd.toFixed(1)} ms\n` : `HRV(RMSSD): 推定不可\n`;
    txt += `まぶたスコア: ${eyelid.toFixed(1)} / 100\n`;
    txt += `※参考値（医療用途では使用不可）`;
    logResults(txt);

    logStatus("測定完了。再測定できます。");
    startBtn.disabled = false;
    progressBar.style.width = "0%";
    progressBar.style.background = "#1e88e5";
  }

  /* --- 測定開始 --- */
  async function startMeasurement() {
    if (running) return;
    running = true;

    rgbSeries = [];
    brightnessSeries = [];
    baseBrightness = null;
    baseSamples = [];
    validSeconds = 0;
    eyeOut = false;

    fatigueEl.textContent = "--";
    levelEl.textContent = "--";
    workEl.textContent = "--";
    dangerEl.textContent = "--";
    faceWarning.textContent = "";
    progressBar.style.width = "0%";
    progressBar.style.background = "#1e88e5";

    logResults("");
    logStatus("カメラ起動中…");
    startBtn.disabled = true;

    document.getElementById("faceGuide").style.display = "block";

    try {
      await initCamera();
    } catch (e) {
      logStatus("カメラが使えません（設定で Safari のカメラ許可を確認）。");
      running = false;
      startBtn.disabled = false;
      document.getElementById("faceGuide").style.display = "none";
      return;
    }

    const frameLoop = setInterval(captureFrame, 1000 / FPS);

    const countdown = setInterval(() => {

      if (!eyeOut) {
        validSeconds++;
        const progress = (validSeconds / DURATION_SEC) * 100;
        progressBar.style.width = `${progress}%`;
        logStatus(`測定中… 有効時間 ${validSeconds} 秒 / 20 秒`);
      } else {
        logStatus("目線が外れています（測定一時停止）");
      }

      if (validSeconds >= DURATION_SEC) {
        clearInterval(countdown);
        clearInterval(frameLoop);
        finishMeasurement();
      }

    }, 1000);
  }

  startBtn.addEventListener('click', () => {
    if (!running) startMeasurement();
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js');
    });
  }
</script>
</body>
</html>
